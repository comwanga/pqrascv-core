# cargo-deny configuration — run with: cargo deny check
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
# Deny crates with known security vulnerabilities.
version = 2
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436) but pulled in transitively by
    # tss-esapi (hardware-tpm feature only). No upstream fix exists yet.
    "RUSTSEC-2024-0436",
    # rsa Marvin Attack: local TPM AK verification only, not exposed to network timing side-channels.
    "RUSTSEC-2023-0071",
    # atty is unmaintained; pulled in by cbindgen (build-only dep of pqrascv-ffi). No upstream fix.
    "RUSTSEC-2024-0375",
    # atty unsound (unaligned read on Windows); same build-only path as above.
    "RUSTSEC-2021-0145",
    # rustls-pemfile is unmaintained; pulled in by pqrascv-sigstore-client. No safe upgrade available.
    "RUSTSEC-2025-0134",
]

[licenses]
# Every dependency must use one of these licenses.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # cbindgen (build dep of pqrascv-ffi) is MPL-2.0.
    "MPL-2.0",
    # ring, rustls-webpki, untrusted (via sigstore-client → ureq → rustls).
    "ISC",
    # webpki-roots (via sigstore-client → ureq). OSI-compatible permissive license.
    "CDLA-Permissive-2.0",
]
# Confidence threshold for license detection (0.0–1.0).
confidence-threshold = 0.8

[bans]
# Warn when the same crate appears at two different versions.
multiple-versions = "warn"
# Disallow wildcard version requirements (e.g. "*").
wildcards = "deny"
# Allow wildcard requirements for local path/git dependencies.
allow-wildcard-paths = true
deny = []

[sources]
# Only allow crates from crates.io. Deny unknown registries and raw git deps.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
