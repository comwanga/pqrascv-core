[package]
name    = "pqrascv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# This crate intentionally lives outside the main workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pqrascv-core  = { path = "../crates/pqrascv-core", features = ["std", "software-rot-unsafe"] }
pqrascv-hardware = { path = "../crates/pqrascv-hardware" }
ciborium = "0.2"

[[bin]]
name = "quote_roundtrip"
path = "fuzz_targets/quote_roundtrip.rs"
test = false
doc  = false

[[bin]]
name = "policy_eval"
path = "fuzz_targets/policy_eval.rs"
test = false
doc  = false

[[bin]]
name = "federation_fuzz"
path = "fuzz_targets/federation_fuzz.rs"
test = false
doc  = false

[[bin]]
name = "bitcoin_node_fuzz"
path = "fuzz_targets/bitcoin_node_fuzz.rs"
test = false
doc  = false

[[bin]]
name = "cbor_parser_fuzz"
path = "fuzz_targets/cbor_parser_fuzz.rs"
test = false
doc  = false

[[bin]]
name = "pki_chain_fuzz"
path = "fuzz_targets/pki_chain_fuzz.rs"
test = false
doc  = false

[[bin]]
name = "provenance_bundle_fuzz"
path = "fuzz_targets/provenance_bundle_fuzz.rs"
test = false
doc  = false
