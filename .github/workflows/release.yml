name: Release Stabilization

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0-rc.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Formal Verification & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Lints
        run: cargo clippy --all -- -D warnings

      - name: Unit Tests & Property Verification
        run: cargo test --all

  create_release:
    name: Create GitHub Release & Publish
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## PQ-RASCV Release ${{ github.event.inputs.version || github.ref_name }}

            This release has passed CI validation.
            - Formatting: Passed
            - Clippy (all features): Passed
            - Unit tests: Passed
          draft: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish in dependency order.
      # Each step uses publish_crate() which treats "already exists" as success
      # so re-running the workflow after a manual publish does not fail.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_crate() {
            local pkg="$1"
            echo "Publishing $pkg …"
            # Capture cargo's output AND exit code without letting `set -e`
            # (GitHub Actions runs `bash -eo pipefail`) abort the step on the
            # bare assignment: the command substitution lives inside an `if`,
            # which is exempt from errexit.
            local out code
            if out=$(cargo publish -p "$pkg" 2>&1); then
              code=0
            else
              code=$?
            fi
            echo "$out"
            # Idempotent: a real `cargo publish` of an already-published version
            # errors with "… is already uploaded"; the dry-run / index path says
            # "already exists". Match either (case-insensitive) and treat as a
            # successful skip so the workflow can be safely re-run.
            if [ "$code" -ne 0 ] && echo "$out" | grep -qiE "already (uploaded|exists)"; then
              echo "  → $pkg already at this version, skipping."
              return 0
            fi
            return "$code"
          }

          # Publish in dependency order; each step is idempotent.
          # 1. No workspace deps
          publish_crate pqrascv-bitcoin-anchor

          # 2. No workspace deps
          publish_crate pqrascv-core

          # 3. Depends on pqrascv-core
          publish_crate pqrascv-sigstore-client

          # 4. Depends on pqrascv-core
          publish_crate pqrascv-verifier

          # 5. Depends on pqrascv-bitcoin-anchor
          publish_crate pqrascv-hardware

          # 6. Depends on pqrascv-core + pqrascv-verifier
          publish_crate pqrascv-cli
