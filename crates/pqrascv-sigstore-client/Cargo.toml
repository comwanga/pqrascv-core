[package]
name          = "pqrascv-sigstore-client"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
description   = "HTTP client for Sigstore (Rekor, Fulcio) — end-to-end signing workflow for pqrascv"

[dependencies]
serde.workspace = true
ureq          = { version = "2", features = ["tls", "json"] }
serde_json    = "1"
base64        = { version = "0.22", features = ["std"] }
thiserror     = "1"
hex           = "0.4"
rustls-pemfile = "2"
tracing       = "0.1"

[dev-dependencies]
mockito = "1"
