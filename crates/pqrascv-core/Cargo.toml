[package]
name          = "pqrascv-core"
description   = "Post-Quantum Remote Attestation & Supply-Chain Verification (PQ-RASCV) prover core — no_std + alloc"
readme        = "../../README.md"
homepage      = "https://github.com/comwanga/pqrascv-core"
documentation = "https://docs.rs/pqrascv-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true

[features]
default      = ["std"]
std          = ["alloc", "serde/std", "ciborium/std", "sha3/std", "zeroize/std", "dep:getrandom"]
alloc        = [
    "serde/alloc",
    "dep:der", "der/alloc",
    "dep:x509-cert",
    "dep:p256",
    "dep:ecdsa",
    "dep:serde_json",
    "dep:base64",
]
# Enables the SoftwareRoT backend. NOT FOR PRODUCTION — see measurement::SoftwareRoT docs.
software-rot-unsafe = []
# Hardware backends (opt-in only)
hardware-tpm = ["dep:tss-esapi"]
dice         = []
intel-tdx  = ["dep:libc", "alloc"]
amd-sev-snp = ["dep:libc", "alloc", "dep:p384", "dep:rsa"]
op-tee = ["dep:libc"]
apple-se = ["dep:security-framework"]

[dependencies]
serde.workspace       = true
serde_bytes.workspace = true
ciborium.workspace    = true
ml-dsa.workspace      = true
sha3.workspace        = true
sha2.workspace        = true
zeroize.workspace     = true
getrandom             = { workspace = true, optional = true }
tss-esapi             = { version = "8.0.0-alpha.2", optional = true }
libc = { version = "0.2", optional = true }
security-framework = { version = "2", optional = true }
subtle.workspace = true

# Sigstore / Fulcio / Rekor provenance verification (conditions 2–5)
# All optional: only compiled when the `alloc` feature is enabled.
# Code using these crates is gated behind #[cfg(feature = "alloc")].
x509-cert    = { version = "0.2", default-features = false, optional = true }
der          = { version = "0.7", default-features = false, optional = true }
p256         = { version = "0.13", default-features = false, features = ["pkcs8", "ecdsa"], optional = true }
ecdsa        = { version = "0.16", default-features = false, features = ["der"], optional = true }
# AMD SEV-SNP attestation: VCEK is ECDSA P-384; ARK/ASK are RSA-4096 (RSASSA-PSS).
p384         = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }
rsa          = { version = "0.9",  default-features = false, features = ["sha2"], optional = true }
serde_json   = { version = "1",   default-features = false, features = ["alloc"], optional = true }
base64       = { version = "0.22", default-features = false, features = ["alloc"], optional = true }

# ── docs.rs configuration ────────────────────────────────────────────────────
# Build docs with `std` + `dice` + `software-rot-unsafe` so all public items are visible.
# `hardware-tpm` is excluded because it requires the tpm2-tss system library.
[package.metadata.docs.rs]
features = ["std", "dice", "software-rot-unsafe"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
pqrascv-core = { path = ".", features = ["std", "software-rot-unsafe"] }
# path = local code in CI/dev; version = published rc.3 resolves during `cargo publish` packaging
pqrascv-verifier = { path = "../verifier", version = "1.0.0-rc.3" }
