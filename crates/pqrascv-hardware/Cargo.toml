[package]
name         = "pqrascv-hardware"
description  = "Hardware-rooted trust and distributed verifier consensus for PQ-RASCV"
readme       = "../../README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[features]
default = ["std"]
std     = []
# Enables the TestOnly backend. MUST NOT be enabled in production builds.
# Gated separately so CI can verify it is absent from release profiles.
unsafe-test-backend = []
# Enables cryptographic AK signature verification (RSA-PSS, ECDSA P-256).
# Requires std. Without this flag, only structural verification is available.
# Enables live evidence acquisition (TPM, IMA, procfs). Linux only.
live-evidence = ["std", "dep:tss-esapi"]
tpm-crypto = ["std", "dep:p256", "dep:rsa", "dep:signature"]

[dependencies]
serde       = { workspace = true }
serde_bytes = { workspace = true }
sha3        = { workspace = true }
sha2        = { workspace = true }
zeroize     = { workspace = true }
ciborium    = { workspace = true }
pqrascv-bitcoin-anchor = { path = "../bitcoin-anchor", version = "1.0.0-rc.5", default-features = false }
ml-kem      = { workspace = true }
ml-dsa      = { workspace = true }
chacha20poly1305 = { workspace = true }

# TPM cryptographic verification (tpm-crypto feature only)
p256        = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"], optional = true }
rsa         = { version = "0.9",  default-features = false, features = ["sha2"],           optional = true }
signature   = { version = "2",    default-features = false,                                optional = true }

# Live Evidence Acquisition
tss-esapi   = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1.11.0"
getrandom = { workspace = true }
