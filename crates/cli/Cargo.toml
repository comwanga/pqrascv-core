[package]
name         = "pqrascv-cli"
description  = "Command-line interface for the PQ-RASCV hardware attestation protocol"
readme       = "../../README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "pqrascv"
path = "src/main.rs"

[dependencies]
# software-rot-unsafe is intentionally included: the CLI is a demo/reference tool
# that generates test quotes via SoftwareRoT. The runtime --software-rot-acknowledged
# flag ensures operators cannot use it accidentally. Remove this feature to build a
# verifier-only binary that cannot produce quotes.
pqrascv-core     = { path = "../pqrascv-core", version = "1.0.0-rc.5", features = ["std", "software-rot-unsafe"] }
pqrascv-verifier = { path = "../verifier",     version = "1.0.0-rc.5" }
clap             = { version = "4", features = ["derive"] }
hex              = "0.4"
anyhow           = "1.0.102"
getrandom.workspace = true
sha3.workspace      = true

[dev-dependencies]
tempfile = "3"
