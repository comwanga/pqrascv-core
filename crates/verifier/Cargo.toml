[package]
name         = "pqrascv-verifier"
description  = "Server-side verifier for PQ-RASCV attestation quotes"
readme       = "../../README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[dependencies]
pqrascv-core = { path = "../pqrascv-core", version = "1.0.0-rc.8", features = ["std"] }
serde.workspace    = true
ciborium.workspace = true
subtle.workspace   = true
tracing            = "0.1"

[dev-dependencies]
ciborium = "0.2"
hex = "0.4"
getrandom = { workspace = true }
sha3.workspace = true
pqrascv-core = { path = "../pqrascv-core", version = "1.0.0-rc.8", features = ["std", "software-rot-unsafe"] }
